<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Leo Capital</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#0b1222;--text:#e2e8f0;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--yellow:#eab308;--orange:#f97316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:21px}.sub{color:var(--muted);font-size:11px;margin-top:3px}
.refresh{background:var(--card);border:none;color:var(--text);border-radius:10px;padding:8px 10px;font-size:16px}
.tabs{display:flex;gap:5px;padding:8px 10px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
.tab{flex:1;min-width:64px;padding:9px 4px;border:none;border-radius:10px;background:var(--card);color:var(--muted);font-weight:700;font-size:12px}
.tab.on{background:var(--blue);color:#fff}
.wrap{padding:6px 12px 50px}.card{background:var(--card);border-radius:14px;padding:13px;margin-bottom:10px;border-left:5px solid #475569}
.big{font-size:30px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;color:#0f172a;white-space:nowrap}
.b-buy{background:var(--green)}.b-great{background:#86efac}.b-watch{background:#93c5fd}.b-avoid{background:var(--orange)}
.c-buy{border-left-color:var(--green)}.c-great{border-left-color:#86efac}.c-watch{border-left-color:#93c5fd}.c-avoid{border-left-color:var(--orange)}
.bar{height:8px;background:#334155;border-radius:4px;overflow:hidden;margin-top:8px}.bar>div{height:100%}
.name{font-weight:800;font-size:15px}.tk{color:var(--muted);font-size:12px;margin-left:4px}
.det{display:none;margin-top:10px;font-size:13px;line-height:1.5;border-top:1px solid #334155;padding-top:10px}.det b{color:#cbd5e1}
.open .det{display:block}.vs{display:flex;gap:10px;margin-top:10px}.vs>div{flex:1;background:var(--card2);border-radius:10px;padding:10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.f{padding:7px 11px;border-radius:999px;border:1px solid #334155;background:none;color:var(--muted);font-size:12px;white-space:nowrap}
.f.on{background:#334155;color:#fff}
.hl{display:block;background:var(--card2);border-radius:10px;padding:9px 10px;margin-top:7px;color:var(--text);text-decoration:none;font-size:13px;line-height:1.35}
.hl .muted{font-size:11px;margin-top:3px}.hl.red{border-left:3px solid var(--red)}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:var(--card);color:var(--text);font-size:14px;margin-bottom:8px}
.sec{font-weight:800;font-size:14px;margin:16px 4px 8px;color:#cbd5e1}.more{color:#93c5fd;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><div><h1>📊 Leo Capital</h1><div class="sub" id="upd">loading…</div></div><button class="refresh" onclick="load()">⟳</button></header>
<div class="tabs">
<button class="tab on" data-t="home">🏠 Home</button><button class="tab" data-t="port">💼 Mine</button><button class="tab" data-t="watch">🛒 Watch</button><button class="tab" data-t="news">📰 News</button><button class="tab" data-t="how">❓ Help</button>
</div>
<div class="wrap" id="main"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp; if(tg){tg.ready();tg.expand();}
const $=s=>document.querySelector(s); let DATA=null, TAB='home', FILT='all', Q='';
const money=(v,c='C$')=>c+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
const pct=v=>(v>=0?'+':'')+(v*100).toFixed(1)+'%'; const cls=v=>v>=0?'pos':'neg';
const esc=s=>(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LINKS=[]; function L(u){LINKS.push(u);return LINKS.length-1;}
function openL(e,i){e.preventDefault();e.stopPropagation();const u=LINKS[i]; if(tg&&tg.openLink) tg.openLink(u); else window.open(u,'_blank');}
function vclass(v){v=(v||'').toUpperCase(); if(v.includes('BUY')) return 'buy'; if(v.includes('GREAT')) return 'great'; if(v.includes('AVOID')||v.includes('PASS')||v.includes('TRAP')) return 'avoid'; return 'watch';}
function ago(ts){const h=(Date.now()/1000-ts)/3600; return h<1?Math.max(1,Math.round(h*60))+' min ago':h<24?Math.round(h)+' h ago':Math.round(h/24)+' d ago';}
function hl(n,showName){const i=L(n.link);return `<a class="hl ${n.flag?'red':''}" href="#" onclick="openL(event,${i})">${n.flag?'🔴 ':'📰 '}${showName?`<b>${esc(n.name)}:</b> `:''}${esc(n.title)}<div class="muted">${esc(n.source)} · ${ago(n.ts)} · tap to read ↗</div></a>`;}
function allNews(){let a=[];DATA.watch.forEach(w=>(w.news||[]).forEach(n=>a.push({...n,name:w.name,tk:w.tk})));return a.sort((x,y)=>(y.flag-x.flag)||(y.ts-x.ts));}
function deep(d){return `<b>Verdict:</b> ${esc(d.verdict)}<br><b>Why:</b> ${esc(d.why)}<br><b>Makes money:</b> ${esc(d.money)}<br><b>Moat:</b> ${esc(d.moat)}<br><b>Record:</b> ${esc(d.record)}<br><b>Strength:</b> ${esc(d.strength)}<br><b>Risks:</b> ${esc(d.risks)}<br><b>5-yr outcomes:</b> ${esc(d.scenarios)}<br><b>In Canada:</b> ${esc(d.canada)}`;}
function summary(){const p=DATA.portfolio; return `<div class="card c-buy"><div class="muted">Paper portfolio · fake C$${p.start_cash.toLocaleString()} since ${p.start}</div>
<div class="big">${money(p.value)}</div><div class="${cls(p.pct)}" style="font-weight:800">${pct(p.pct)}</div>
<div class="vs"><div><div class="muted">Leo Capital</div><b class="${cls(p.pct)}">${pct(p.pct)}</b></div><div><div class="muted">XEQT (index)</div><b class="${cls(p.bench_pct)}">${pct(p.bench_pct)}</b></div></div>
<div class="muted" style="margin-top:8px">${p.pct>=p.bench_pct?'✅ Beating the index':'⚠️ Behind the index'} · Cash waiting: ${money(p.cash)}</div></div>`;}
function stockCard(w,extra){const v=vclass(w.verdict); const away=w.gap>=0?'ON SALE ✅':`needs ${pct(w.gap)}`;
const fill=Math.max(0,Math.min(100,(1+w.gap)*100)); const col=w.gap>=0?'var(--green)':w.gap>-0.15?'var(--yellow)':'#64748b';
const ns=w.news||[]; const top=ns.slice(0,2).map(n=>hl(n,false)).join('');
const src=w.src?`<a class="hl" href="#" onclick="openL(event,${L(w.src)})">📄 Main source we used ↗</a>`:'';
return `<div class="card c-${v}" onclick="this.classList.toggle('open')"><div class="row"><div><span class="name">${esc(w.name)}</span><span class="tk">${w.tk}</span></div><span class="badge b-${v}">${esc(w.verdict)||'—'}</span></div>
${extra||''}<div class="row muted" style="margin-top:6px"><span>Now ${w.cur}${w.px} <span class="${cls(w.chg||0)}">${pct(w.chg||0)}</span></span><span>Buy ≤ ${w.cur}${w.buy}</span><span style="color:${col};font-weight:800">${away}</span></div>
<div class="bar"><div style="width:${fill}%;background:${col}"></div></div>${top}
<div class="more">${ns.length>2?`+${ns.length-2} more headlines · `:''}tap card for details ▾</div>
<div class="det">${w.what?`<b>What it does:</b> ${esc(w.what)}<br>`:''}${w.story?`<b>Our news check:</b> ${esc(w.story)}<br>`:''}${w.deep?'<br>'+deep(w.deep):''}${ns.slice(2).map(n=>hl(n,false)).join('')}${src}</div></div>`;}
function home(){const reds=allNews().filter(n=>n.flag).slice(0,5); const near=[...DATA.watch].sort((a,b)=>b.gap-a.gap).slice(0,4);
const own=DATA.portfolio.pos.map(x=>x.tk); const ownNews=allNews().filter(n=>own.includes(n.tk)).sort((a,b)=>b.ts-a.ts).slice(0,4);
return summary()+`<div class="sec">📰 About what you own</div>${ownNews.length?ownNews.map(n=>hl(n,true)).join(''):'<div class="muted">No new headlines.</div>'}
<div class="sec">🔴 Important news on the watchlist</div>${reds.length?reds.map(n=>hl(n,true)).join(''):'<div class="muted">Nothing important right now.</div>'}
<div class="sec">🎯 Closest to a buy</div>${near.map(w=>stockCard(w)).join('')}`;}
function port(){const p=DATA.portfolio; let h=summary();
p.pos.forEach(x=>{const w=DATA.watch.find(z=>z.tk==x.tk)||{name:x.tk,tk:x.tk,news:[],gap:0,cur:'',px:x.px,buy:'',verdict:''};
h+=stockCard(w,`<div class="row" style="margin-top:6px"><span class="muted">Bought ${x.date} @ ${x.cur=='USD'?'US$':'C$'}${x.buy_px} · cost ${money(x.cost)}</span><span><b>${money(x.value)}</b> <span class="${cls(x.pct)}">${pct(x.pct)}</span></span></div>`)});
return h+`<div class="card"><div class="name">📝 Trade log</div><div class="muted" style="margin-top:6px">${p.log.map(esc).join('<br>')}</div></div>`;}
function watch(){const fs=[['all','All'],['buy','✅ Buy'],['great','🟢 Great'],['watch','👀 Watch'],['near','🔥 Within 15%'],['news','🔴 Has news']];
return `<input class="search" placeholder="🔎 Search company or ticker" value="${esc(Q)}" oninput="Q=this.value;document.getElementById('wl').innerHTML=wl()">
<div class="filters">${fs.map(f=>`<button class="f ${FILT==f[0]?'on':''}" onclick="FILT='${f[0]}';render()">${f[1]}</button>`).join('')}</div><div id="wl">${wl()}</div>`;}
function wl(){const q=Q.toLowerCase(); const R=DATA.watch.filter(w=>(!q||w.name.toLowerCase().includes(q)||w.tk.toLowerCase().includes(q))&&(FILT=='all'||(FILT=='near'?w.gap>=-0.15:FILT=='news'?(w.news||[]).some(n=>n.flag):vclass(w.verdict)==FILT)));
return R.length?R.map(w=>stockCard(w)).join(''):'<div class="muted">No matches.</div>';}
function news(){const a=allNews(); if(!a.length) return '<div class="card">No news in the last 2 days.</div>';
return `<div class="muted" style="margin:0 4px 8px">Last 2 days · ${a.length} headlines · 🔴 = important (CEO, lawsuit, takeover, guidance cut, downgrade…) · tap to read</div>`+a.map(n=>hl(n,true)).join('');}
function how(){return `<div class="card"><div class="name">The 3 tests (all needed to BUY)</div><div style="margin-top:8px;font-size:13px;line-height:1.5">① <b>Quality</b>: earns 15%+ on owners' money, 10%+ margin, profitable 3 years, low debt<br>② <b>On sale</b>: price 25%+ below fair value (15× the 3-year average profit)<br>③ <b>News check</b>: no business-breaking threat, profit not fake/peak</div></div>
<div class="card"><div class="name">Colours</div><div style="margin-top:8px;font-size:13px;line-height:1.8"><span class="badge b-buy">BUY</span> passed all 3<br><span class="badge b-great">GREAT</span> great business, waiting for price<br><span class="badge b-watch">WATCH</span> question mark<br><span class="badge b-avoid">AVOID/PASS</span> not now<br>Bar = how close the price is to the buy price (green = on sale).</div></div>
<div class="card"><div class="name">How it updates</div><div style="margin-top:8px;font-size:13px;line-height:1.5">Every ~30 minutes while the market is open (9:45am-4:30pm ET, weekdays): live prices, paper portfolio vs XEQT, big moves, and headlines from Google News. You get a Telegram ping for buy prices, big moves and 🔴 news. Verdicts and deep notes are refreshed by Hermes when you ask ("news check &lt;company&gt;") or at the quarterly re-scan.<br><br><b>Paper only:</b> fake C$10,000. No real money, no orders.</div></div>`;}
function render(){LINKS=[];$('#main').innerHTML=TAB=='home'?home():TAB=='port'?port():TAB=='watch'?watch():TAB=='news'?news():how();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');TAB=b.dataset.t;render();window.scrollTo(0,0);});
function load(){$('#upd').textContent='refreshing…';fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;const t=new Date(d.updated.replace(' UTC','Z').replace(' ','T'));$('#upd').textContent='Updated '+t.toLocaleString()+' · USD/CAD '+d.usdcad;render();}).catch(e=>{$('#main').innerHTML='<div class="card">Could not load data. Tap ⟳</div>'});}
load();
</script>
</body>
</html>
