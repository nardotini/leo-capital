name: leo-capital
on:
  schedule:
    - cron: "45 14 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - name: Alerts + paper portfolio + app data
        run: python run.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save
        run: |
          git config user.name "leo-capital"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "daily update" && git pull --rebase && git push)
